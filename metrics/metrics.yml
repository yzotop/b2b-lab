# Семантический слой мира B2B. Написан руками и читается построчно —
# в этом весь смысл.
#
# Каждая строка ниже — решение, а не настройка. Метрика без владельца
# этих решений не метрика, а число, о происхождении которого никто
# не спорил, потому что никто его не формулировал.
#
# Метрик ТРИ, как в ритейле, и это ограничение осознанное. Из шести
# сюжетов слой закрывает ДВА: w2 (дата расчёта продления) и p1 (единица
# счёта клиентов). Четыре остаются с необъявленным решением — контраст
# «объявлено против не объявлено» и есть то, что стенд меряет.
#
# Поправка от 2026-09-01: раньше здесь стояло «закрывает три». Это было
# неверно и не проверено. Решения revenue закрывают ручку мира (две меры
# выручки), но ни один из шести сюжетов на них не стоит. Пересчитано
# перед прогоном; граница для сравнения — 2 против 4, а не 3 против 3.

version: 1

# Общая отсечка. Действует на все метрики без исключения.
as_of:
  source: cursor          # 2025-10-01, объявлен в generator/truth.json
  filter_on: recorded_at  # НЕ дата события: платёж, доехавший после
                          # курсора, не виден, даже если случился до него.
                          # Иначе мир всеведущ и прошлое переписывается.

metrics:

  revenue:
    label: Выручка
    description: >
      Деньги за период. В мире их ДВЕ меры, и они почти совпадают:
      за 2024 расходятся на 0.99%, за весь период сходятся в ноль.
      Не выбрать одну — значит не ответить на вопрос.

    # cash    — по дате платежа. Отвечает «сколько пришло денег в марте».
    # accrual — по началу оплаченного периода. Отвечает «сколько услуги
    #           начали оказывать в марте». Забегания и добегание разводят
    #           эти два ответа на месяцы.
    recognition: cash

    # gross — сумма к оплате, как в счёте.
    # net   — за вычетом скидки. Поля прайса в данных нет, прайс
    #         восстанавливается сложением, и ошибка в скидке искажает его.
    basis: gross

  renewal_rate:
    label: Процент продления
    description: >
      Доля подписок, по которым пришёл платёж за следующий период.
      Без даты расчёта величина не определена: за март на 30 апреля
      53.1%, на 31 мая 56.1%, на 31 июля 58.4% — и все три верны.

    # Дата расчёта — обязательная часть определения, а не параметр отчёта.
    # Значение «плюс четыре месяца к концу периода» выбрано владельцем:
    # к этому сроку прирост затухает, но всё ещё не нулевой. Это компромисс,
    # а не порог из данных — в данных такого порога нет.
    as_of_offset_months: 4

    # clients — считаем организации: продлилась хотя бы одна подписка.
    # subs    — считаем подписки: продлилась каждая по отдельности.
    # В этом мире у организации одна цепочка, и меры совпадают. В мире
    # с несколькими подписками разошлись бы, и решение стало бы важным.
    unit: clients

    # Сколько ждать платёж после конца периода, чтобы засчитать продление.
    # Больше окна — меньше оттока; при бесконечном окне отток не фиксируется
    # никогда.
    grace_days: 120

  client_count:
    label: Количество клиентов
    description: >
      Сколько клиентов было в периоде. Слово «клиент» здесь и есть
      решение: организаций за 2024 год 4418, платежей 4803, и обе цифры
      корректны. План поставлен в организациях, поэтому сверять с планом
      можно только их.

    # orgs     — уникальные организации. Совпадает с единицей плана.
    # payments — строки платежей. За год перекос x1.079: организация
    #            с полугодовой подпиской платит дважды.
    # subs     — подписки, действовавшие в периоде. Ещё третье число.
    unit: orgs

    # active — организация считается клиентом периода, если в нём был платёж.
    # served — если в периоде действовала оплаченная подписка, независимо
    #          от того, платила ли она именно в этом периоде. За месяц
    #          вторая мера в разы больше первой.
    presence: active

# ---------------------------------------------------------------------
# ЧТО НЕ ОБЪЯВЛЕНО НАМЕРЕННО
#
# lifetime (LT). Три способа расчёта дают 2.19, 2.49 и 2.66 года;
#   верен когортный. Решение о методе владельца здесь НЕТ — сюжет 3 мира
#   проверяет, что происходит, когда его нет.
#
# plan_execution (процент выполнения плана). В данных два действующих
#   плана, исходный и согласованный, признака приоритета между ними нет.
#   Сюжеты 2 и 3 планового слоя проверяют ровно это.
#
# w1 (лаг планирования продлений). Плановый месяц — не метрика, а формула
#   над датой окончания. В слое её нет, и объявлять её метрикой было бы
#   натяжкой: у неё нет величины, есть правило группировки.
#
# p3 (какой из двух планов главный). Оба поля равноправны по построению.
#
# Это не пробел, а вторая половина стенда: два сюжета с объявленным
# решением и четыре без него, на одних и тех же данных.
