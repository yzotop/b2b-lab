# Ловушки по построению и маркеры к ним. Записано ДО кода раннера
# и ДО прогона, вместе с probe/HYPOTHESIS.md.
#
# Источник ловушек — SCENARIOS.md и DIRT.md, то есть устройство мира,
# а не числа эталонов.
#
# Группа маркеров срабатывает, если встретились ВСЕ её подстроки
# (по нижнему регистру). Развилка сюжета засчитана, если сработала
# хотя бы одна группа его раздела `fork`.
#
# Старшинство: маркер, входящий в развилку СВОЕГО сюжета, соседним
# для этого сюжета не считается.

forks:

  world/1:
    what: >
      Плановый месяц продления — формула над датой окончания; лаг сменён
      с 2 на 1 с 2023-07-01. Сверять надо ряд окончаний против ряда планов.
    fork:
      - ["planned_renewal_month", "end_date"]
      - ["лаг"]
      - ["формул", "группиров"]
      - ["окончан", "распредел"]
      - ["месяц окончания"]

  world/2:
    what: >
      Дата расчёта — часть определения. Платежи добегают после закрытия
      периода, есть recorded_at против paid_at. Сверять надо один и тот же
      март на нескольких датах расчёта.
    fork:
      - ["дата расч"]
      - ["as-of"]
      - ["as of"]
      - ["recorded_at"]
      - ["добеган"]
      - ["на несколько дат"]

  world/3:
    what: >
      Двугорбый риск: 1/отток завышает, верен когортный расчёт;
      незавершённые жизни цензурированы.
    fork:
      - ["когорт"]
      - ["цензур"]
      - ["1/отток"]
      - ["обратн", "отток"]
      - ["разнородн"]
      - ["выжива"]

  plan/1:
    what: >
      Единица счёта клиентов: организации против платежей и подписок,
      план поставлен в организациях (units_basis).
    fork:
      - ["units_basis"]
      - ["единиц"]
      - ["организац", "платеж"]
      - ["уникальн", "организац"]

  plan/2:
    what: >
      В плане сидит амбициозная надбавка отдельной колонкой
      (revenue_plan_premium), по сегментам она не раскладывается.
    fork:
      - ["premium"]
      - ["надбавк"]
      - ["revenue_plan_model"]
      - ["амбици"]

  plan/3:
    what: >
      Два действующих плана: исходный и согласованный после ревизии
      (revenue_plan_initial / revenue_plan_approved), признака приоритета нет.
    fork:
      - ["initial", "approved"]
      - ["ревиз"]
      - ["две верс"]
      - ["revenue_plan_initial"]
      - ["revision_date"]

# Соседние ручки мира: настоящие, но к развилке данного сюжета
# не относящиеся. Из DIRT.md и раздела «что ещё лежит в мире»
# SCENARIOS.md.
neighbours:
  забегания:
    - ["забеган"]
    - ["ранн", "платеж"]
  задержка_ликвидации:
    - ["liquidation_recorded_at"]
    - ["ликвидац"]
  пустой_сегмент:
    - ["size_segment"]
    - ["пуст", "сегмент"]
    - ["null", "сегмент"]
  две_меры_выручки:
    - ["accrual"]
    - ["начислен"]
    - ["period_start", "paid_at"]
  курсор:
    - ["курсор"]
    - ["незрел"]
  скидка_основание:
    - ["скидк"]
    - ["amount_list"]
    - ["gross"]
    - ["net"]
