id: w2c
scenario: world/2
scenario_title: Процент продления на три даты
subject: 13 определение + 14 выбор действия
form: нейтральная

question: >
    Когда можно считать март закрытым и вешать цифру на дашборд?

truth:
  answer: >
    Ответа в данных нет — это решение с владельцем. Данные показывают, что
    прирост между апрелем и июлем 5.3 п.п. и продолжает затухать; выбрать
    выдержку — значит выбрать компромисс между свежестью и стабильностью. В
    данных нет порога, при котором прирост «уже неважен».
  decision_rule: >
    Отделить измеримое от решаемого. Кривая добегания измерима; точка отсечки
    — нет, у неё должен быть владелец и она должна быть объявлена в
    семантическом слое.
  known_by: >
    Кривая добегания следует из late_pay_share и late_pay_days_mean; порога
    среди объявленных входов НЕТ, и это намеренно.

naive:
  answer: >
    «Через месяц после закрытия периода» — цифра, взятая из общей практики,
    без ссылки на данные этого продукта.
  why: >
    Вопрос звучит фактически, и на него хочется ответить числом. Что число
    здесь придумывает отвечающий, а не находит, — заметно только если искать,
    где оно объявлено.
