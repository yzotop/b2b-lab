id: p1b
scenario: plan/1
scenario_title: Единица счёта
subject: 11 причина + 10 юнит-экономика
form: нейтральная

question: >
    Продажи в штуках растут, а чек падает. Мы демпингуем?

truth:
  answer: >
    Нет. Обе цифры — следствие того, что штуки считаются в платежах, а не в
    клиентах. Знаменатель среднего чека раздут на те же 7.9%, на которые
    «выросли» штуки. Цена не менялась: тарифы и распределение скидок в мире
    постоянны.
  decision_rule: >
    Если рост числителя и падение частного идут ровно на одну величину,
    сначала проверить знаменатель, а потом искать содержательную причину.
  known_by: >
    Те же входы; тарифы и доля скидок объявлены в generator/truth.json и во
    времени не меняются.

naive:
  answer: >
    «Да, идёт ценовое давление» — с предложением поднять цены или ограничить
    скидки.
  why: >
    Демпинг — готовое объяснение для пары «больше сделок, ниже чек», и оно не
    требует смотреть на определение штуки.
