id: p2b
scenario: plan/2
scenario_title: Амбициозная надбавка
subject: 11 причина
form: нейтральная

question: >
    Сегменты объясняют только часть отставания. Откуда остальное?

truth:
  answer: >
    Остальное — надбавка, 22% сверх модельной части. Необъяснённое отклонение
    сходится с ней до копейки. Это не остаток, который ещё предстоит
    объяснить, а часть плана, которая никогда не была подкреплена расчётом.
  decision_rule: >
    Необъяснённый остаток факторного анализа сначала сверить с
    недетализированными строками плана, и только потом искать в данных.
  known_by: >
    Те же входы; равенство проверяется в plan/verify_plan.py.

naive:
  answer: >
    Поиск причины в данных: сезонность, качество лидов, работа отдела. Либо
    вывод «остаток в пределах погрешности модели».
  why: >
    Необъяснённый остаток по привычке трактуют как недостаток анализа. Мысль,
    что он объяснён и лежит в самом плане, требует прочитать состав плана, а
    не только его итог.
