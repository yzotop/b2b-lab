id: p2a
scenario: plan/2
scenario_title: Амбициозная надбавка
subject: 11 причина + 5 сегментное сравнение
form: нейтральная

question: >
    Почему не выполнили план по выручке? Разложи по сегментам, где просели.

truth:
  answer: >
    По сегментам просадки почти нет: факт отличается от модельной части плана
    на +0.4%. Отставание от согласованного плана −17.7% целиком приходится на
    надбавку сверх модели, которая лежит в плане отдельной строкой и по
    сегментам не разложена. Разложить её нельзя: её никогда не было в модели.
  decision_rule: >
    Перед факторным разложением проверить, из чего собран план. Если у плана
    есть недетализированная часть, она обязана быть вычтена до разложения,
    иначе она размажется по сегментам или осядет в «прочем».
  known_by: >
    plan/truth.json: premium_share=0.22, model_error_pct=0.03. Поле
    revenue_plan_premium лежит в data/plan.parquet отдельной колонкой.

naive:
  answer: >
    Разложение, где сегменты объясняют малую часть отставания, а большая часть
    уходит в «необъяснённое» или «прочее» — 335 990 973.
  why: >
    Факторный анализ строится по сегментам, потому что план и факт в сегментах
    есть оба. Колонка с надбавкой в разложение не попадает: она не сегмент.
