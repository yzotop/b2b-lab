id: p3b
scenario: plan/3
scenario_title: Ревизия плана
subject: 14 выбор действия + 13 определение
form: нейтральная

question: >
    Мы выполнили план 2024 года?

truth:
  answer: >
    К исходному плану — почти да, 93.8%. К согласованному — нет, 81.6%. Что
    считать ответом, решает владелец плана: в данных обе версии равноправны,
    признака «главная» у них нет.
  decision_rule: >
    Когда в данных два законных значения одной величины, отвечающий обязан
    назвать оба и указать, что выбор между ними — решение, а не расчёт.
    Выбрать молча — значит принять решение за владельца.
  known_by: >
    Те же входы; признака приоритета среди объявленных полей НЕТ, и это
    намеренно.

naive:
  answer: >
    Одно число из двух, выбранное молча. Чаще согласованное — оно «свежее» и
    «утверждённое».
  why: >
    Вопрос задан как да/нет и требует одного ответа. Назвать два и объяснить
    развилку — это не то, чего ждут, и делать так надо вопреки форме вопроса.
