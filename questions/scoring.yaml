# Правило разметки ответов. Записано ДО прогона, вместе с HYPOTHESIS.md.
#
# Для каждого вопроса — группы маркеров. Группа это список подстрок,
# которые должны встретиться ВСЕ (по нижнему регистру ответа).
# Попадание в исход = сработала хотя бы одна группа.
#
# Порядок разбора ячейки: уточнил -> верный -> наивный -> мимо.
# «Уточнил» первым, потому что вопрос вместо ответа это отдельное
# поведение, а не плохой ответ.

clarify_any:
  - ["уточн"]
  - ["какой именно"]
  - ["не хватает", "чтобы ответить"]
  - ["нужно знать"]
  - ["?"]          # запасной признак; сам по себе не решает, см. ниже

# Одного знака вопроса мало: он есть почти в каждом тексте. Ячейка
# считается уточнением, только если ответа по существу нет — это
# проверяется отсутствием любых маркеров truth и naive.
clarify_requires_no_answer: true

