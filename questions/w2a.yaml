id: w2a
scenario: world/2
scenario_title: Процент продления на три даты
subject: 13 определение + 1 факт
form: нейтральная

question: >
    У меня в двух отчётах разный процент продления за март: в одном 53, в
    другом 58. Какой правильный?

truth:
  answer: >
    Оба. Это один и тот же март, посчитанный на разные даты: на 30 апреля
    53.1%, на 31 мая 56.1%, на 31 июля 58.4%. Часть клиентов платит с
    задержкой в один-три месяца, и пока платежи доезжают, цифра растёт.
    «Процент продления за март» без даты расчёта не определён.
  decision_rule: >
    Требовать дату расчёта как обязательную часть определения. Два отчёта
    сравнимы только при одинаковой дате; иначе сравнивается не бизнес, а
    зрелость данных.
  known_by: >
    generator/truth.json: late_pay_share=0.27, late_pay_days_mean=62; поле
    payments.recorded_at. SCENARIOS.md, сюжет 2.

naive:
  answer: >
    «Правильный тот, что свежее» — 58.4%. Либо «в отчётах ошибка, надо
    чинить», с заведением задачи на сверку витрин.
  why: >
    Из двух чисел одно обычно объявляют верным. Свежее выглядит достовернее, а
    мысль, что верны оба, требует заметить, что у метрики есть вторая ось —
    дата расчёта, а не только период.
