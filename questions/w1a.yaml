id: w1a
scenario: world/1
scenario_title: Смена лага продления
subject: 11 причина + 2 динамика
form: нейтральная

question: >
    Что случилось в июле? План продлений просел в ноль, а в августе скакнул на
    треть. Мы кого-то потеряли?

truth:
  answer: >
    Не потеряли никого. В июле 2023 сменили лаг планирования: плановый месяц
    продления считался как «месяц окончания минус два», стал «минус один». При
    таком переходе в июль не попадает ни одно окончание — подписки,
    кончающиеся в сентябре, уехали из июля в август. Бизнес не изменился:
    окончаний подписок по месяцам 391, 353, 309, 355, 356, 487, 383 — ряд
    гладкий.
  decision_rule: >
    Прежде чем объяснять провал планового месяца, проверить, чем этот месяц
    заполняется. Плановый месяц — не свойство клиента, а формула над датой
    окончания. Сравнивать надо ряд окончаний, а не ряд планов.
  known_by: >
    generator/truth.json: renewal_lag_before=2, renewal_lag_after=1,
    renewal_lag_switch=2023-07-01. SCENARIOS.md, сюжет 1.

naive:
  answer: >
    «В июле продления обвалились до нуля, в августе отскок +37%». Дальше —
    версии про отпуска, про сезонность, про сбой в отделе продаж.
  why: >
    План по месяцам — единственный ряд, который смотрят при вопросе про план.
    Он действительно прыгает. Ряд окончаний подписок лежит в соседней колонке
    и никем не запрашивается, потому что вопрос был про план.
