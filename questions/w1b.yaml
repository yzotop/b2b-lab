id: w1b
scenario: world/1
scenario_title: Смена лага продления
subject: 2 динамика + 11 причина
form: нейтральная

question: >
    Почему план на август вырос так сильно? Мы правда ждём столько продлений?

truth:
  answer: >
    Август получил на себя два разных набора: то, что при старом лаге пришлось
    бы на него, и то, что переехало из июля. Ждать столько продлений не надо —
    в августе заканчивается 356 подписок, а план на август 487. План и
    окончания в этом месяце относятся к разным подпискам.
  decision_rule: >
    «План на месяц» и «окончания в месяце» — разные множества, связанные
    лагом. При смене лага связь разрывается на один месяц. Сверять надо по
    конкретным подпискам, а не по счётчикам месяцев.
  known_by: >
    Те же входы; SCENARIOS.md, сюжет 1, таблица план против окончаний.

naive:
  answer: >
    «Да, в августе пик продлений, готовим ресурсы отдела». Планирование
    нагрузки под несуществующий всплеск.
  why: >
    Цифра плана выросла, и она официальная. Проверять её против физических
    окончаний незачем — она и есть план.
