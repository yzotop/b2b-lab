id: w2b
scenario: world/2
scenario_title: Процент продления на три даты
subject: 2 динамика + 13 определение
form: нейтральная

question: >
    Мы в марте продлились хуже, чем обычно?

truth:
  answer: >
    По данным на конец апреля март выглядит хуже соседних месяцев, но это
    артефакт незрелости: у марта было меньше времени на добегание платежей.
    Сравнивать месяцы можно только на одинаковой выдержке — например, каждый
    месяц на дату «плюс четыре месяца».
  decision_rule: >
    При сравнении периодов уравнять возраст данных, а не только длину периода.
    Свежий месяц систематически проигрывает старому.
  known_by: >
    Те же входы; свойство добегания задано долей и средней задержкой.

naive:
  answer: >
    «Да, март просел на 3-5 пунктов относительно января-февраля». Вывод про
    ухудшение удержания в марте.
  why: >
    Отчёт отдаёт все месяцы одной таблицей, и разная зрелость в ней никак не
    помечена. Мартовская цифра меньше — значит март хуже.
