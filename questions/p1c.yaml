id: p1c
scenario: plan/1
scenario_title: Единица счёта
subject: 1 факт + 13 определение
form: нейтральная

question: >
    Сколько у нас было клиентов в 2024 году?

truth:
  answer: >
    Зависит от того, что считать клиентом: уникальных организаций 4418,
    платежей 4803. План поставлен в организациях, поэтому для сверки с планом
    верно 4418. Оба числа корректны, но отвечают на разные вопросы.
  decision_rule: >
    Вопрос «сколько клиентов» неполон без единицы счёта. Если ответ пойдёт в
    сверку с планом, единицу берут из плана, а не из удобства запроса.
  known_by: >
    plan/truth.json: units_basis='orgs'; факт меряется по
    data/payments.parquet и data/orgs.parquet.

naive:
  answer: >
    4803 — count(*) по платежам за год.
  why: >
    Таблица платежей — самая естественная точка входа для вопроса про клиентов
    за период, и count(*) по ней не требует ни одного решения.
