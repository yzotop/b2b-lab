id: p3a
scenario: plan/3
scenario_title: Ревизия плана
subject: 13 определение + 1 факт
form: нейтральная

question: >
    У нас выполнение плана 94% или 82%? В двух отчётах разные цифры, и обе за
    2024-й.

truth:
  answer: >
    Обе верны. 93.8% — к исходному плану, 81.6% — к согласованному после
    ревизии. План 2024 года пересматривался в июле вверх на 15%, и оба
    значения остались в данных: revenue_plan_initial и revenue_plan_approved.
    Факт в обоих случаях один и тот же.
  decision_rule: >
    «Процент выполнения плана» без указания, к какому плану, — неполный
    термин, ровно как процент продления без даты расчёта. Требовать имя поля,
    а не только период.
  known_by: >
    plan/truth.json: revised_years=[2021, 2024], revision_uplift=0.15,
    revision_month=7. Отношение процентов ровно 1.1500.

naive:
  answer: >
    «Правильная та, что в утверждённом отчёте» — одна из двух, без указания
    какая и почему. Либо задача на сверку витрин.
  why: >
    Два числа одной метрики за один период читаются как расхождение систем.
    Что в данных лежат два разных плана и оба действующие — видно только если
    открыть состав таблицы плана.
