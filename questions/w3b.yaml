id: w3b
scenario: world/3
scenario_title: Время жизни клиента
subject: 11 причина + 13 определение
form: нейтральная

question: >
    У финансов LT 2.5 года, у меня по когортам выходит 2.2. Кто из нас ошибся?

truth:
  answer: >
    Никто не ошибся в арифметике — расходятся методы. 2.49 это 1/общий отток,
    2.19 когортный. Разница в том, что формула считает риск ухода одинаковым в
    любой год жизни, а в этом продукте после первого периода уходит 71%
    клиентов, зато выжившие держатся долго. В группе «подошедших к сроку» доля
    выживших высока, наблюдаемый отток ниже среднего риска, и обратная к нему
    величина больше настоящей средней жизни.
  decision_rule: >
    При расхождении двух оценок одной величины сначала выяснить, одну ли
    величину они оценивают. Здесь — разные оценки одной, и одна из них смещена
    по построению.
  known_by: >
    Те же входы; двугорбость проверяется распределением числа периодов.

naive:
  answer: >
    «Возьмём среднее, 2.35» или «у финансов методика утверждённая, берём 2.5».
  why: >
    Два числа одной величины читаются как спор о точности, а не как разные
    определения. Усреднение выглядит компромиссом, хотя усредняются верное и
    систематически смещённое.
