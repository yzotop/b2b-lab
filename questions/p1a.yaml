id: p1a
scenario: plan/1
scenario_title: Единица счёта
subject: 11 причина + 10 юнит-экономика
form: нейтральная

question: >
    Мы перевыполнили план по клиентам на 8%, но средний чек ниже плана. Мы
    что, набрали мелочи?

truth:
  answer: >
    Ни мелочи, ни перевыполнения. План поставлен в клиентах — уникальных
    организациях, — а факт посчитан в платежах. Организация с полугодовой
    подпиской платит дважды за год, отсюда перекос ×1.079. Считая факт в
    организациях: отклонение −0.1%, то есть плановая погрешность; средний чек
    47 870 против планового 47 666.
  decision_rule: >
    Перед сравнением плана с фактом привести единицу счёта. Единица плана
    объявлена в самих данных полем units_basis; если факт считается иначе, обе
    цифры — и штуки, и средний чек — уезжают, причём в разные стороны.
  known_by: >
    plan/truth.json: units_basis='orgs', units_error_pct=0.02. plan/README.md.

naive:
  answer: >
    «Перевыполнили по штукам +7.8%, средний чек −7%». Дальше — версия про
    смещение в мелкий сегмент или про рост скидок.
  why: >
    Обе цифры считаются из одной таблицы платежей и выглядят согласованно:
    больше сделок, дешевле каждая. Что знаменатель у них разный с плановым, не
    видно, пока не спросить, в чём план.
